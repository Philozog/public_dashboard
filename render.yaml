# One-click hosting on Render: see "Put it on a website" in README.md.
services:
  - type: web
    name: apothicaire
    runtime: python
    # A persistent disk (below) needs a paid plan; on the free plan the
    # portfolio would be wiped every time the app restarts.
    plan: starter
    buildCommand: pip install -r requirements.txt gunicorn==23.0.0
    # One worker: the portfolio is a single SQLite file.
    startCommand: gunicorn app:server --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    disk:
      name: portfolio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APOTHICAIRE_DB
        value: /var/data/portfolio.db
      # One "name:password" per person, separated by commas. The first name
      # keeps the original portfolio; each other person gets their own.
      - key: DASHBOARD_USERS
        sync: false
      # Signs the sign-in cookie so people stay signed in across restarts.
      - key: SECRET_KEY
        generateValue: true
      # Older single shared password; ignored once DASHBOARD_USERS is set.
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: NEWS_API_KEY
        sync: false
